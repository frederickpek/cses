name: Update README

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update progress
        env:
          CSES_USERNAME: ${{ secrets.CSES_USERNAME }}
          CSES_PASSWORD: ${{ secrets.CSES_PASSWORD }}
        run: python3 scripts/update_readme.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet assets/progress.svg || (git add assets/progress.svg && git commit -m "Update solve stats" && git push)
